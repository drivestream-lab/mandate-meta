apiVersion: launchpad/v1
kind: ScaffoldConfig

org: drivestream-lab

meta:
  enabled: true
  engine: cookiecutter
  template: gh:drivestream-lab/tenant-meta-foundation
  ref: v0.1.0
  context:
    meta_repo: mandate-meta
    client_id: mandate
    display_name: Mandate
    org: drivestream-lab
    forge_type: github

repos:
  mandate:
    enabled: true
    engine: cookiecutter
    template: gh:drivestream-lab/python-fastapi-foundation
    ref: v0.3.5
    context:
      service_name: mandate
      service_description: Mandate core, the governor for autonomous agent delivery
      default_port: "8000"

  # mandate-control-tower: no cookiecutter. Scaffolded with Paperclip's
  # create-paperclip-plugin against the SDK at the pinned baseline (PL-4).
  # mandate-verify: no scaffold. Workflow repo maintained by named humans.
